    width:50%;
    font-size:9px;
    height:26px;
    padding:3px 5px
}
.align-buttons {
    display:flex;
    justify-content:space-between;
    gap:2px
}
.align-buttons button {
    width:31px;
    height:28px;
    border-radius:3px
}
.align-buttons svg {
    width:17px;
    height:17px
}
.align-note {
    font-size:9px;
    color:var(--dim);
    margin-top:9px
}
.pathfinder-buttons {
    display:flex;
    gap:8px
}
.pathfinder-buttons button {
    flex:1;
    flex-direction:column;
    gap:6px;
    border:1px solid var(--border-soft);
    border-radius:4px;
    padding:9px 4px 7px;
    font-size:8px;
    color:var(--muted)
}
.pathfinder-buttons svg {
    width:20px;
    height:20px
}
.swatch-grid {
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:6px
}
.swatch-grid button {
    height:18px;
    border:1px solid #ffffff20;
    border-radius:3px;
    padding:0;
    position:relative
}
.swatch-grid button:hover {
    outline:2px solid var(--text);
    outline-offset:1px
}
.swatch-grid button.current::after {
    content:'';
    position:absolute;
    inset:3px;
    border:1px solid #fff8;
    border-radius:1px
}
.swatch-caption {
    font-size:9px;
    color:var(--dim);
    margin-top:10px
}
.artboard-row {
    display:flex;
    align-items:center;
    gap:9px;
    text-align:left;
    width:100%;
    border-radius:4px;
    padding:7px 5px;
    margin:2px 0
}
.artboard-row .board-thumb {
    width:25px;
    height:28px;
    border:1px solid #ffffff35;
    border-radius:2px;
    flex-shrink:0
}
.board-row-text {
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0
}
.board-row-text strong {
    font-size:10px;
    font-weight:400;
    text-overflow:ellipsis;
    overflow:hidden;
    white-space:nowrap
}
.board-row-text small {
    font-size:8px;
    color:var(--dim)
}
.artboard-row.active {
    background:var(--field)
}
.artboard-row .board-index {
    font-size:9px;
    color:var(--dim);
    margin-left:auto
}
.section-action {
    width:100%;
    border:1px solid var(--border-soft);
    border-radius:4px;
    font-size:10px;
    padding:7px;
    margin-top:9px;
    color:var(--muted)
}
.section-action svg {
    width:13px;
    height:13px
}
.quick-actions {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px
}
.quick-actions button {
    font-size:9px;
    padding:7px;
    border:1px solid var(--border-soft);
    border-radius:4px
}
.inspector-footer {
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border-top:1px solid var(--border);
    height:30px;
    font-size:8px;
    color:var(--dim)
}
.private-icon svg {
    width:11px;
    height:11px
}
.layer-search {
    margin:14px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--border-soft);
    border-radius:4px;
    padding:0 7px;
    background:var(--field)
}
.layer-search svg {
    width:13px;
    height:13px;
    color:var(--dim)
}
.layer-search input {
    width:100%;
    border:0;
    background:transparent;
    box-shadow:none;
    font-size:10px;
    padding:7px 0
}
.layer-row {
    display:flex;
    align-items:center;
    gap:5px;
    min-height:35px;
    border-bottom:1px solid #00000018;
    padding:2px 8px;
    cursor:pointer;
    user-select:none
}
.layer-row:hover {
    background:var(--hover)
}
.layer-row.selected {
    background:var(--accent-dim)
}
.layer-row.layer-header {
    background:var(--panel-alt);
    font-size:10px
}
.layer-row button {
    width:17px;
    height:23px;
    padding:0;
    color:var(--dim)
}
.layer-row button svg {
    width:12px;
    height:12px
}
.layer-row .visible-off {
    opacity:.3
}
.layer-color {

    width:3px;
    border-radius:1px;
    margin:0 3px
}
.layer-name {
    flex:1;
    font-size:10px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
}
.layer-row .layer-node-icon {
    margin:0 4px;
    color:var(--muted)
}
.layer-node-icon svg {
    width:14px;
    height:14px
}
.layer-row.node-row {
    padding-left:25px;
    min-height:32px
}
.layer-row.node-row .layer-name {
    font-size:9px
}
.layer-row.drag-over {
    box-shadow:inset 0 2px 0 var(--accent)
}
.layer-counter {
    font-size:8px;
    color:var(--dim);
    padding:0 3px
}
.layer-target {
    width:8px;
    height:8px;
    border:1px solid var(--muted);
    border-radius:50%;
    margin:0 4px
}
.selected .layer-target {
    border-color:var(--accent);
    background:var(--accent)
}
.layer-actions {
    position:sticky;
    bottom:0;
    background:var(--panel-alt);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:5px 10px;
    min-height:35px;
    font-size:9px;
    color:var(--dim)
}
.history-row {
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:11px 16px;
    text-align:left;
    font-size:10px
}
.history-row svg {
    width:15px;
    height:15px;
    color:var(--dim)
}
.history-row.current {
    background:var(--accent-dim);
    color:var(--accent)
}
.history-row.future {
    opacity:.38
}
.empty-panel {
    padding:27px 20px;
    color:var(--dim);
    font-size:11px;
    line-height:1.7
}
.empty-panel strong {
    color:var(--text);
    display:block;
    margin-bottom:8px
}
.statusbar {
    height:28px;
    flex-shrink:0;
    background:var(--panel-alt);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:3px;
    font-size:9px;
    color:var(--muted);
    user-select:none
}
.statusbar .divider {
    height:12px;
    margin:0 6px
}
.statusbar select {
    border:0;
    background:none;
    padding:2px;
    height:23px;
    font-size:9px
}
.status-tool {
    min-width:54px;
    font-size:9px
}
.status-icon {
    width:19px;
    height:22px
}
.status-icon svg {
    width:11px;
    height:11px
}
#board-select {
    max-width:151px
}
.status-description {
    font-size:9px;
    margin-left:22px;
    color:var(--dim);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis
}
.statusbar #status-stats {
    font-size:8px;
    margin-left:12px;
    color:var(--dim);
    min-width:110px;
    text-align:right
}
#renderer-badge {
    gap:6px;
    font-size:9px;
    padding:4px 7px;
    border-radius:3px
}
.engine-dot {
    width:5px;
    height:5px;
    border-radius:50%;
    background:#86b9a0
}
.engine-dot.fallback {
    background:#d9a86c
}
.menu-popover {
    position:fixed;
    z-index:100;
    background:var(--panel);
    border:1px solid var(--border-soft);
    box-shadow:var(--shadow);
    border-radius:6px;
    padding:5px;
    min-width:233px;
    max-height:80vh;
    overflow:auto
}
.menu-item {
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 10px;
    width:100%;
    border-radius:3px;
    text-align:left;
    font-size:11px
}
.menu-item .menu-label {
    flex:1
}
.menu-item .menu-shortcut {
    font-size:10px;
    color:var(--dim)
}
.menu-item svg {
    width:14px;
    height:14px;
    color:var(--muted)
}
.menu-separator {
    height:1px;
    background:var(--border-soft);
    margin:5px
}
.menu-caption {
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:var(--dim);
    padding:9px 10px 5px
}
.color-popover {
    position:fixed;
    z-index:101;
    width:244px;
    padding:15px;
    background:var(--panel-raised);
    border:1px solid var(--border-soft);
    box-shadow:var(--shadow);
    border-radius:8px
}
.color-popover h3 {
    font-size:12px;
    font-weight:600;
    margin:0 0 13px
}
.color-popover input[type=color] {
    width:100%;
    height:109px;
    border:0;
    padding:0;
    border-radius:5px;
    margin-bottom:10px
}
.color-fields {
    display:flex;
    align-items:center;
    gap:7px;
    margin:8px 0 14px
}
.color-fields input {
    width:100%;
    font-family:monospace;
    font-size:11px
}
.color-fields button {
    width:27px;
    height:27px;
    border:1px solid var(--border-soft);
    border-radius:3px
}
.color-popover .swatch-grid {
    grid-template-columns:repeat(8,1fr);
    gap:7px
}
.color-popover .section-action {
    margin-top:13px
}
.color-popover .swatch-grid button {
    height:19px
}
#toast-region {
    position:fixed;
    z-index:300;
    bottom:49px;
    right:327px;
    display:flex;
    flex-direction:column;
    gap:9px;
    max-width:400px;
    pointer-events:none
}
.toast {
    background:var(--panel-raised);
    color:var(--text);
    border:1px solid var(--border-soft);
    border-left:3px solid var(--accent);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:13px 17px;
    font-size:11px;
    line-height:1.5;
    animation:toast-in .15s ease-out
}
.toast.error {
    border-left-color:#f87676
}
.toast.fade {
    opacity:0;
    transform:translateY(5px);
    transition:.2s
}
@keyframes toast-in {
    from {
        opacity:0;
        transform:translateY(8px)
    }
    to {
        opacity:1;
        transform:translateY(0)
    }
    
}
dialog {
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:0;
    width:540px;
    max-width:calc(100vw - 40px);
    max-height:calc(100vh - 60px);
    box-shadow:0 30px 100px #0008;
    overflow:auto
}
dialog::backdrop {
    background:#111217a8;
    backdrop-filter:blur(4px)
}
.modal-header {
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:26px 28px 18px
}
.modal-header h2 {
    font-size:23px;
    font-weight:550;
    letter-spacing:-.5px;
    margin:0 0 8px
}
.modal-header p {
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
    margin:0
}
.modal-header .close {
    margin:-8px -9px 0 0;
    width:28px;
    height:28px;
    border-radius:4px
}
.modal-body {
    padding:0 28px 25px
}
.modal-footer {
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:16px 28px;
    background:var(--panel-alt);
    border-top:1px solid var(--border)
}
.button {
    border:1px solid var(--border-soft);
    border-radius:5px;
    padding:9px 17px;
    font-size:11px
}
.button.primary {
    background:var(--accent);
    color:#2d211c;
    border-color:var(--accent);
    font-weight:600
}
.button.primary:hover {
    filter:brightness(1.1)
}
.modal-body .field-column {
    gap:15px
}
.modal-body .field-column label>span:first-child {
    min-width:82px
}
.modal-body .field-column input,.modal-body .field-column select {
    height:34px;
    font-size:12px
}
.preset-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:5px 0 25px
}
.preset-card {
    border:1px solid var(--border-soft);
    border-radius:7px;
    padding:17px 8px;
    display:flex;
    flex-direction:column;
    gap:9px
}
.preset-card svg {
    height:27px;
    width:27px;
    color:var(--accent)
}
.preset-card strong {
    font-size:11px;
    font-weight:500
}
.preset-card small {
    font-size:9px;
    color:var(--dim)
}
.preset-card.active {
    border-color:var(--accent);
    background:var(--accent-dim)
}
.modal-note {
    font-size:10px;
    line-height:1.65;
    color:var(--muted);
    padding:14px 15px;
    background:var(--field);
    border-radius:6px;
    margin-top:18px
}
.modal-note strong {
    color:var(--text)
}
.shortcut-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 24px;
    margin:10px 0
}
.shortcut-grid>div {
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:11px;
    border-bottom:1px solid var(--border-soft);
    padding:9px 0;
    gap:10px
}
.shortcut-grid kbd {
    font-family:inherit;
    color:var(--muted);
    font-size:10px;
    white-space:nowrap
}
.diagnostics {
    display:grid;
    grid-template-columns:125px 1fr;
    gap:13px;
    font-size:11px;
    line-height:1.4
}
.diagnostics dt {
    color:var(--dim)
}
.diagnostics dd {
    margin:0;
    overflow-wrap:anywhere
}
.palette-dialog {
    width:580px
}
.command-search {
    width:100%;
    border:0;
    border-bottom:1px solid var(--border-soft);
    background:transparent;
    font-size:17px;
    padding:21px 24px;
    border-radius:0;
    box-shadow:none!important
}
.command-results {
    max-height:360px;
    overflow:auto;
    padding:8px
}
.command-results .menu-item {
    padding:12px
}
.command-results .menu-item:first-child {
    background:var(--accent-dim)
}
.palette-footer {
    padding:11px 22px;
    color:var(--dim);
    font-size:9px;
    border-top:1px solid var(--border-soft)
}
.about-brand {
    display:flex;
    align-items:center;
    gap:15px;
    margin:4px 0 23px
}
.about-brand .brand-mark {
    width:54px;
    height:54px;
    border-radius:12px
}
.about-brand svg {
    width:40px;
    height:40px
}
.about-brand strong {
    font-size:32px;
    font-weight:600;
    letter-spacing:-1px
}
.about-brand small {
    display:block;
    font-size:10px;
    color:var(--muted);
    letter-spacing:1.2px;
    margin-top:3px
}
@media(max-width:1200px) {
    .save-state {
        display:none
    }
    .menu-trigger {
        padding:8px 6px
    }
    .inspector {
        width:250px
    }
    .controlbar .optional {
        display:none
    }
    .status-description {
        margin-left:8px;
        max-width:300px
    }
    .canvas-controls {
        left:32px
    }
    .canvas-hint {
        font-size:8px;
        gap:5px;
        padding:7px 9px
    }
    .brand {
        padding-right:12px
    }
    .panel-section {
        padding:15px 14px
    }
    .panel-tabs button {
        padding:0 11px
    }
    #toast-region {
        right:291px
    }
    
}
@media(max-width:960px) {
    .inspector {
        width:230px
    }
    .panel-rail {
        display:none
    }
    .menubar nav .menu-trigger:nth-child(n+6) {
        display:none
    }
    .brand {
        font-size:14px
    }
    .status-description {
        display:none
    }
    .canvas-hint {
        display:none
    }
    .controlbar .context-type {
        min-width:72px
    }
    .swatch-grid {
        gap:4px
    }
    .panel-tabs button {
        padding:0 10px
    }
    .save-state {
        display:none
    }
    #document-mode {
        display:none
    }
    .menubar {
        padding-right:8px
    }
    .inline-label {
        gap:4px
    }
    #toast-region {
        right:248px
    }
    
}
@media(max-width:700px) {
    .inspector {
        display:none
    }
    .menubar nav .menu-trigger:nth-child(n+4) {
        display:none
    }
    .brand {
        padding-right:6px
    }
    .menubar {
        padding-left:8px
    }
    .controlbar .inline-label {
        display:none
    }
    .controlbar {
        padding-left:12px
    }
    .statusbar #status-stats {
        display:none
    }
    .statusbar .status-tool {
        display:none
    }
    .tools {
        width:56px
    }
    .document-tab {
        max-width:260px
    }
    .controlbar .workspace-button {
        display:none
    }
    #toast-region {
        left:70px;
        right:15px
    }
    .header-divider {
        margin:0 3px
    }
    .menubar .icon-button {
        width:25px
    }
    .export-top {
        padding:7px 10px
    }
    .modal-header,.modal-body {
        padding-left:20px;
        padding-right:20px
    }
    .panel-content {
        overscroll-behavior:contain
    }
    
}
/* Explicit canvas stacking keeps accelerated surfaces in the same stacking context. */
#background {
    z-index:0
}
#gpu,#fallback {
    z-index:1
}
#overlay {
    z-index:3
}


/* 底部状态栏：固定（非浮动）中英文切换下拉框 */
.rw-lang-wrap{display:inline-flex;align-items:center;gap:3px;margin-left:2px}
.rw-lang-lbl{font-size:9px;color:var(--muted)}
.statusbar #rw-lang-select{border:1px solid rgba(127,127,127,.45);background:rgba(127,127,127,.16);color:var(--text);height:20px;font-size:9px;padding:0 2px;border-radius:3px;cursor:pointer;max-width:72px;outline:none}
.statusbar #rw-lang-select option{background:#232428;color:#eceff1}
</style>

<body>
<div id="app">
<header class="menubar">
 <button class="brand" data-cmd="about" title="About Editor"><span>Editor</span></button>
 <nav id="menus" aria-label="Main menu"></nav>
 <div class="menu-spacer"></div>
 <span id="save-state" class="save-state"><span class="save-dot"></span>Local-first workspace</span>
 <button class="icon-button" data-cmd="palette" title="Search commands (Ctrl/⌘ K)" data-icon="search"></button>
 <button class="icon-button" data-cmd="theme" title="Switch light / dark appearance" data-icon="sun"></button>
 <span class="header-divider"></span><button class="export-top" data-cmd="export"><span data-icon="export"></span>Export<span data-icon="chevronDown"></span></button>
</header>
<div class="controlbar">
 <span id="context-type" class="context-type">No selection</span><span class="divider"></span>
 <button class="paint-button" id="top-fill" title="Fill color"><span class="paint-chip" id="top-fill-chip"></span><span data-icon="chevronDown"></span></button>
 <button class="paint-button" id="top-stroke" title="Stroke color"><span class="paint-chip stroke-chip" id="top-stroke-chip"></span><span data-icon="chevronDown"></span></button>
 <label class="inline-label">Stroke <input id="top-stroke-width" type="number" value="2" min="0" max="2000" step=".5" aria-label="Stroke width"><span class="dim">px</span></label>
 <span class="divider"></span><label class="inline-label">Opacity <input id="top-opacity" type="number" min="0" max="100" value="100" aria-label="Object opacity"><span class="dim">%</span></label>
 <span class="divider optional"></span><div class="align-strip optional"><button class="icon-button" data-cmd="align-left" title="Align left" data-icon="alignLeft"></button><button class="icon-button" data-cmd="align-center" title="Align horizontal centers" data-icon="alignCenter"></button><button class="icon-button" data-cmd="align-right" title="Align right" data-icon="alignRight"></button></div>
 <span class="menu-spacer"></span><button class="quiet-button optional" data-cmd="setup">Document setup</button><span class="divider"></span><button class="workspace-button" data-cmd="workspace">Essentials <span data-icon="chevronDown"></span></button>
</div>
<div class="main-layout">
 <aside class="tools" aria-label="Drawing tools"><div class="tool-collapse" data-icon="chevrons"></div><div id="tool-grid" class="tool-grid"></div><div class="tool-rule"></div>
 <div class="paint-stack"><button id="tool-stroke" title="Stroke color" class="stack-stroke"></button><button id="tool-fill" title="Fill color" class="stack-fill"></button><button class="swap" data-cmd="swap-paint" title="Swap fill and stroke (Shift X)" data-icon="swap"></button><button class="defaults" data-cmd="default-paint" title="Default fill and stroke (D)" data-icon="defaultPaint"></button></div>
 <div class="mini-paints"><button data-cmd="solid" title="Solid fill" class="solid-mini"></button><button data-cmd="gradient" title="Gradient fill" class="gradient-mini"></button><button data-cmd="no-fill" title="No fill" class="none-mini"></button></div>

(function () {
    var app = window.vectora;
    if (!app) return;
    var READY = false;
    function toHost (type, payload) {
        try { parent.postMessage(Object.assign({type: type}, payload || {}), '*'); } catch (e) {}
    }
    // Remove any solid <rect> whose geometry covers (nearly) the whole artboard AND
    // that has no id/transform/data-name — i.e. the editor's background, not a
    // user-created shape. Keeps user-drawn white rectangles intact.
    function stripBackgroundRect (svg, board) {
        try {
            if (!board) return svg;
            var bw = Number(board.w) || 0, bh = Number(board.h) || 0;
            var bx = Number(board.x) || 0, by = Number(board.y) || 0;
            if (!bw || !bh) return svg;
            return svg.replace(/<rect\b[^>]*\/?>/g, function (tag) {
                if (/\bid\s*=/.test(tag) || /\btransform\s*=/.test(tag) || /\bdata-name\s*=/.test(tag)) return tag;
                var w = tag.match(/\bwidth\s*=\s*["']([\d.]+)["']/);
                var h = tag.match(/\bheight\s*=\s*["']([\d.]+)["']/);
                var x = tag.match(/\bx\s*=\s*["']([-\d.]+)["']/);
                var y = tag.match(/\by\s*=\s*["']([-\d.]+)["']/);
                if (!w || !h) return tag;
                var W = parseFloat(w[1]), H = parseFloat(h[1]);
                var X = x ? parseFloat(x[1]) : 0, Y = y ? parseFloat(y[1]) : 0;
                var covers = Math.abs(W - bw) <= 1 && Math.abs(H - bh) <= 1 &&
                             Math.abs(X - bx) <= 1 && Math.abs(Y - by) <= 1;
                return covers ? '' : tag;
            });
        } catch (e) { return svg; }
    }
    function exportNow () {
        if (!READY) return;
        try {
            var doc = app.store.doc;
            var board = doc.artboards.find(function (b) { return b.id === app.store.activeArtboard; }) || doc.artboards[0];
            // skipBackground=true: never send the editor's white board background back
            // to Scratch, otherwise it shows up as an unwanted white rectangle shape.
            var svg = V.svgExport(doc, board, null, true, true);
            // Belt-and-braces: strip any full-board solid rect that slipped through.
            svg = stripBackgroundRect(svg, board);

        } catch (e) { console.warn('[Editor] export failed', e); }
    }
    window.addEventListener('message', function (e) {
        var d = e.data;

        if (d.type === 'vectora:init') {

})();

  var REV = {};
  for (var k in DICT) { if (DICT.hasOwnProperty(k) && DICT[k] !== k && !REV[DICT[k]]) REV[DICT[k]] = k; }
  // 大小写不敏感索引：把 key 的小写形式映射到原始 key，解决 Direct Selection / Selection 等大小写差异
  var LOWER = {};
  for (var kk in DICT) { if (DICT.hasOwnProperty(kk)) LOWER[kk.toLowerCase()] = kk; }
  var LOWER_REV = {};
  for (var kr in REV) { if (REV.hasOwnProperty(kr)) LOWER_REV[kr.toLowerCase()] = kr; }

  var KEY = 'rw_i18n_lang';
  function detectHostLang () {
    var raw = '';
    try { raw = localStorage.getItem('tw:language') || ''; } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem('currentLocale') || ''; } catch (e) {} }
    if (!raw) { try { raw = document.documentElement.lang || ''; } catch (e) {} }
    if (!raw) { try { raw = (parent && parent.document && parent.document.documentElement.lang) || ''; } catch (e) {} }
    var base = String(raw || '').split('-')[0].toLowerCase();
    return base === 'en' ? 'en' : 'zh';
  }
  function readLang () {
    var saved = '';
    try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
    if (saved === 'zh' || saved === 'en') return saved;
    return detectHostLang();
  }
  var lang = readLang();

  // 单一片段翻译（含大小写不敏感回退）
  function trPiece (piece, map, lower) {
    if (!piece) return piece;
    if (map[piece] && map[piece] !== piece) return map[piece];
    var lk = lower[piece.toLowerCase()];
    if (lk && map[lk] && map[lk] !== piece) return map[lk];
    return null;
  }
  // 片段翻译：整串 + 数字+单位动态串（objects/artboards 等）
  function trSeg (piece, map, lower) {
    if (!piece) return piece;
    var rep = trPiece(piece, map, lower);
    if (rep && rep !== piece) return rep;
    var dm = String(piece).match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
    if (dm) {
      var num = dm[1], unit = dm[2].trim();
      var urep = trPiece(unit, map, lower);
      if (!urep) {
        var sing = unit.replace(/ies$/, 'y').replace(/s$/, '');
        urep = trPiece(sing, map, lower);
      }
      if (urep && urep !== unit) return num + ' ' + urep;
    }
    return null;
  }
  // 翻译一个完整文本；支持快捷键后缀、分隔符复合串、数字+单位动态串
  function translate (s) {
    if (!s) return s;
    var t = String(s).trim();
    if (!t) return s;
    var map = (lang === 'zh') ? DICT : REV;
    var lower = (lang === 'zh') ? LOWER : LOWER_REV;

    // 1) 整串精确（含大小写不敏感）
    var rep = trPiece(t, map, lower);
    if (rep && rep !== t) return String(s).replace(t, rep);

    // 2) 快捷键后缀： "Selection (V)" / "切换语言 / Switch language" 之类，拆括号/斜杠
    var km = t.match(/^(.*?)\s*[\(\uff08]([^\)\uff09]{1,12})[\)\uff09]$/);
    if (km) {
      var head = km[1].trim(), tail = km[2];
      var hrep = trPiece(head, map, lower);
      var trep = trPiece(tail, map, lower);
      if ((hrep && hrep !== head) || (trep && trep !== tail)) {
        var rebuilt = (hrep || head) + ' (' + (trep || tail) + ')';
        return String(s).replace(t, rebuilt);

    }

    // 3) 分隔符复合串： "3 artboards · 38 editable objects" / "720 × 840 px" / "Guides: on"
    if (/[\u00b7\u00d7:|\/\u2013\u2014]/.test(t) || / \/ /.test(t)) {
      var parts = t.split(/(\s*[\u00b7\u00d7|\u2013\u2014]\s*|:\s*|\s+\/\s+)/);
      var changed = false;

        if (!p || !/[A-Za-z\u4e00-\u9fff]/.test(p)) { out += p; continue; }
        var pr = trSeg(p.trim(), map, lower);
        if (pr && pr !== p.trim()) { out += p.replace(p.trim(), pr); changed = true; }
        else out += p;
      }
      if (changed) return String(s).replace(t, out);
    }

    // 4) 数字 + 单位动态串： "0 objects" / "38 objects" / "2.8 ms CPU"
    var drep = trSeg(t, map, lower);

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || typeof d !== 'object') return;
      var l = (d.lang === 'zh' || d.lang === 'en') ? d.lang

      if (l && (d.type === 'rw:set-lang' || d.type === 'studio:set-lang')) setLang(l);
